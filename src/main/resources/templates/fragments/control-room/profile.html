<section th:fragment="content" class="view" id="view-profile">
                    <div class="section-head">
                        <div>
                            <h2 data-copy-key="copy-81">Profilo del Capo</h2>
                            <p>Identità, contatti, ruolo e impostazioni del responsabile.</p>
                        </div>
                        <div class="actions"><button class="btn" id="changePasswordBtn">Cambia password</button><button class="btn primary" id="editProfileBtn">Modifica profilo</button></div>
                    </div>

                    <div class="panel">
                        <div class="profile-hero">
                            <div class="avatar xl" id="profileAvatar">C</div>
                            <div>
                                <h3 class="profile-name" id="profileName" th:text="'Responsabile ' + ${brandName}">Capo RadioTech</h3>
                                <div class="profile-role" id="profileRole" th:text="'Chief Executive · ' + ${brandName}">Chief Executive · RadioTech</div>
                                <div class="subtle" style="margin-top:8px">Account autenticato e autorizzato</div>
                            </div>
                            <span class="badge green">ACCOUNT ATTIVO</span>
                        </div>

                        <div class="profile-grid">
                            <div class="profile-field"><label data-copy-key="copy-83">Nome completo</label><strong
                                    id="profileFullName">—</strong></div>
                            <div class="profile-field"><label data-copy-key="copy-84">Email</label><strong id="profileEmail">—</strong></div>
                            <div class="profile-field"><label data-copy-key="copy-85">Telefono</label><strong id="profilePhone">—</strong></div>
                            <div class="profile-field"><label data-copy-key="copy-86">Ruolo</label><strong id="profileRoleField">—</strong>
                            </div>
                            <div class="profile-field"><label data-copy-key="copy-87">UID Firebase</label><strong id="profileUid">—</strong>
                            </div>
                            <div class="profile-field"><label data-copy-key="copy-88">Ultimo accesso</label><strong
                                    id="profileLastLogin">—</strong></div>
                        </div>
                    </div>
                </section>
