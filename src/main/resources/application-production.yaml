server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${RADIOTECH_TRUSTED_PROXY_REGEX:127\.0\.0\.1|::1}
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
    connection-timeout: 10s
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: radiotech
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

radiotech:
  attachments:
    backend: ${RADIOTECH_ATTACHMENT_BACKEND:FIRESTORE}
  operations:
    daily-read-warning: ${RADIOTECH_OPERATIONS_DAILY_READ_WARNING:40000}
    daily-write-warning: ${RADIOTECH_OPERATIONS_DAILY_WRITE_WARNING:16000}
    daily-delete-warning: ${RADIOTECH_OPERATIONS_DAILY_DELETE_WARNING:16000}
    storage-warning-bytes: ${RADIOTECH_OPERATIONS_STORAGE_WARNING_BYTES:858993459}
    object-storage-warning-bytes: ${RADIOTECH_OPERATIONS_OBJECT_STORAGE_WARNING_BYTES:67108864}
    pending-report-hours: ${RADIOTECH_OPERATIONS_PENDING_REPORT_HOURS:24}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
