server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: ${RADIOTECH_TRUSTED_PROXY_REGEX:127\.0\.0\.1|::1}
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
    connection-timeout: 10s
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: radiotech
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

radiotech:
  attachments:
    backend: ${RADIOTECH_ATTACHMENT_BACKEND:FIRESTORE}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
