server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  main:
    banner-mode: "log"

logging:
  level:
    org.springframework.web: INFO

management:
  tracing:
    enabled: ${RADIOTECH_OTLP_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,firestore,reportVerification

app:
  firestore:
    seed: ${RADIOTECH_FIRESTORE_SEED:false}
    seed-tenant-id: ${RADIOTECH_FIRESTORE_SEED_TENANT_ID:}
  firebase:
    enabled: ${RADIOTECH_FIREBASE_ENABLED:true}
    project-id: ${FIREBASE_PROJECT_ID:gestionale-radio}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:}
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
    database-url: ${FIREBASE_DATABASE_URL:https://gestionale-radio-default-rtdb.europe-west1.firebasedatabase.app}

radiotech:
  branding:
    product-name: ${RADIOTECH_BRAND_NAME:RadioTech}
    product-subtitle: ${RADIOTECH_BRAND_SUBTITLE:Gestione operativa}
    company-name: ${RADIOTECH_BRAND_COMPANY:RadioTech}
    support-email: ${RADIOTECH_BRAND_SUPPORT_EMAIL:}
    logo-path: ${RADIOTECH_BRAND_LOGO_PATH:/assets/brand/radiotech-symbol-v1.png}
    legal-text: ${RADIOTECH_BRAND_LEGAL_TEXT:}
  pro:
    scan-delay-ms: ${RADIOTECH_PRO_SCAN_DELAY_MS:300000}
    webhook-hosts: ${RADIOTECH_WEBHOOK_HOSTS:}
    webhook-secret: ${RADIOTECH_WEBHOOK_SECRET:}
  ai:
    enabled: ${RADIOTECH_AI_ENABLED:false}
    ollama-url: ${RADIOTECH_OLLAMA_URL:http://127.0.0.1:11434}
    model: ${RADIOTECH_AI_MODEL:qwen3:4b}
  reports:
    verification-secret: ${RADIOTECH_REPORT_VERIFICATION_SECRET:}
    public-base-url: ${RADIOTECH_PUBLIC_BASE_URL:}
  capo:
    email: ${RADIOTECH_CAPO_EMAIL:capo@radiotech.it}
  firebase:
    web-api-key: ${RADIOTECH_FIREBASE_WEB_API_KEY:}
  security:
    metrics-token: ${RADIOTECH_METRICS_TOKEN:}
    federated-login-enabled: ${RADIOTECH_SSO_ENABLED:false}
    cors-origins: ${RADIOTECH_CORS_ORIGINS:http://localhost:8080}
    rate-limit-per-minute: ${RADIOTECH_RATE_LIMIT_PER_MINUTE:10}
  geo:
    geofence-radius-meters: ${RADIOTECH_GEOFENCE_RADIUS_METERS:250}
    max-accuracy-meters: ${RADIOTECH_GPS_MAX_ACCURACY_METERS:100}
  sla:
    warning-minutes: ${RADIOTECH_SLA_WARNING_MINUTES:60}
  bootstrap:
    secret: ${RADIOTECH_BOOTSTRAP_SECRET:}
    tenant-id: ${RADIOTECH_BOOTSTRAP_TENANT_ID:}
  tenant:
    invite-secret: ${RADIOTECH_TENANT_INVITE_SECRET:}
    migration:
      enabled: ${RADIOTECH_TENANT_MIGRATION_ENABLED:false}
      tenant-id: ${RADIOTECH_LEGACY_TENANT_ID:}
      single-tenant-confirmed: ${RADIOTECH_TENANT_MIGRATION_SINGLE_TENANT_CONFIRMED:false}
      replace-default: ${RADIOTECH_TENANT_MIGRATION_REPLACE_DEFAULT:false}
      apply: ${RADIOTECH_TENANT_MIGRATION_APPLY:false}
