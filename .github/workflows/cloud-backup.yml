name: Encrypted offsite backup and restore drill
on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_PROJECT_ID: gestionale-radio
      FIREBASE_STORAGE_BUCKET: ''
      RADIOTECH_BACKUP_ARCHIVE: .dist/backups/radiotech-${{ github.run_id }}.rtbackup
      RADIOTECH_BACKUP_DESTINATION: GITHUB_ACTIONS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare private backup credentials
        env:
          BACKUP_ACCOUNT_JSON: ${{ secrets.FIREBASE_BACKUP_SERVICE_ACCOUNT }}
          BACKUP_KEY_BASE64: ${{ secrets.FIREBASE_BACKUP_KEY_BASE64 }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          if (!process.env.BACKUP_ACCOUNT_JSON || !process.env.BACKUP_KEY_BASE64) throw new Error('Configure FIREBASE_BACKUP_SERVICE_ACCOUNT and FIREBASE_BACKUP_KEY_BASE64 before enabling backups.');
          const account = JSON.parse(process.env.BACKUP_ACCOUNT_JSON), key = Buffer.from(process.env.BACKUP_KEY_BASE64, 'base64');
          if (account.project_id !== 'gestionale-radio' || key.length !== 32) throw new Error('Backup configuration does not match this project.');
          const credential = path.join(process.env.RUNNER_TEMP, 'backup-account.json'), keyFile = path.join(process.env.RUNNER_TEMP, 'backup.key');
          fs.writeFileSync(credential, process.env.BACKUP_ACCOUNT_JSON, {mode: 0o600});
          fs.writeFileSync(keyFile, key, {mode: 0o600});
          fs.appendFileSync(process.env.GITHUB_ENV, `FIREBASE_SERVICE_ACCOUNT_PATH=${credential}\nRADIOTECH_BACKUP_KEY_FILE=${keyFile}\n`);
          NODE
      - name: Export and authenticate encrypted archive
        run: |
          bash gradlew backupTool --console=plain -PbackupMode=export -PbackupArchive="$RADIOTECH_BACKUP_ARCHIVE" -PbackupKey="$RADIOTECH_BACKUP_KEY_FILE"
          bash gradlew backupTool --console=plain -PbackupMode=verify -PbackupArchive="$RADIOTECH_BACKUP_ARCHIVE" -PbackupKey="$RADIOTECH_BACKUP_KEY_FILE"
      - name: Install emulator runner
        run: npm install --global firebase-tools@15.26.0
      - name: Restore and compare documents, identities and attachments
        run: firebase emulators:exec --project demo-radiotech-backup --only firestore,auth "node scripts/run-backup-drill.cjs"
      - name: Store encrypted offsite backup
        uses: actions/upload-artifact@v4
        with:
          name: radiotech-encrypted-backup-${{ github.run_id }}
          path: |
            .dist/backups/*.rtbackup
            .dist/backup-drill-result.json
          if-no-files-found: error
          retention-days: 90
      - name: Record successful offsite upload and restore test
        run: bash gradlew backupTool --console=plain -PbackupMode=record-success -PbackupArchive="$RADIOTECH_BACKUP_ARCHIVE" -PbackupKey="$RADIOTECH_BACKUP_KEY_FILE"
