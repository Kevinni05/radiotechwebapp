name: Radio Tech CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Backend test suite
        run: ./gradlew test --no-daemon --console=plain

  firebase-rules:
    name: Firebase rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Firestore and Storage rules
        run: npm run test:rules

      - name: Firestore and Auth emulator integration tests
        run: npm run test:firestore

  artifact:
    name: Reproducible backend artifact
    needs: [backend, firebase-rules]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build artifact twice and compare hashes
        shell: bash
        run: |
          ./gradlew clean bootJar --no-daemon --console=plain
          artifact_hash_first=$(sha256sum build/libs/*.jar | cut -d' ' -f1)
          ./gradlew clean bootJar --no-daemon --console=plain
          artifact_hash_second=$(sha256sum build/libs/*.jar | cut -d' ' -f1)
          test "$artifact_hash_first" = "$artifact_hash_second"

      - name: Store backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: radiotech-backend
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
