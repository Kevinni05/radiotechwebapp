name: Radio Tech CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity-authority:
    name: Independent identity authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: identity-service/package-lock.json
      - run: npm ci
        working-directory: identity-service
      - run: npm audit --audit-level=high
        working-directory: identity-service
      - run: npm test
        working-directory: identity-service
      - run: npm run build
        working-directory: identity-service
      - run: npx playwright install --with-deps chromium
        working-directory: identity-service
      - run: npm run test:web
        working-directory: identity-service

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Backend test suite
        run: bash gradlew test --no-daemon --console=plain
      - name: Backup configuration regression tests
        run: node --test scripts/backup-credentials.test.cjs scripts/refresh-coordinator.test.cjs scripts/ambient-canvas.test.mjs
      - name: Workforce index rollout checks
        run: python3 -m unittest discover -s scripts -p test_workforce_indexes.py

  firebase-rules:
    name: Firebase rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Firebase CLI separately from application dependencies
        run: npm install --global firebase-tools@15.26.0

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Managed authentication session contracts
        run: node --test scripts/auth-client-session.test.mjs

      - name: Firestore and Storage rules
        run: npm run test:rules

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Install projection dependencies
        run: npm ci --prefix functions

      - name: Firestore and Auth emulator integration tests
        run: npm run test:firestore

  artifact:
    name: Reproducible backend artifact
    needs: [backend, firebase-rules, web, identity-authority]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build artifact twice and compare hashes
        shell: bash
        run: |
          bash gradlew clean bootJar --no-daemon --console=plain
          artifact_hash_first=$(sha256sum build/libs/*.jar | cut -d' ' -f1)
          bash gradlew clean bootJar --no-daemon --console=plain
          artifact_hash_second=$(sha256sum build/libs/*.jar | cut -d' ' -f1)
          test "$artifact_hash_first" = "$artifact_hash_second"

      - name: Store backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: radiotech-backend
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  web:
    name: Browser workflows and responsive layout (${{ matrix.browser }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:auth
      - run: npm run build:control-room
      - run: npm run build:operations
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: bash gradlew bootJar --no-daemon --console=plain
      - run: npm run test:web -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-verification-${{ matrix.browser }}
          path: |
            build/reports/web/
            test-results/
          retention-days: 14

  container:
    name: Production container build
    runs-on: ubuntu-latest
    needs: [backend, firebase-rules, web, identity-authority]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag radiotech:ci .
      - name: Verify private download staging is writable by the runtime user
        run: docker run --rm --entrypoint sh radiotech:ci -c 'test -w /app/.dist/private-files && test -w /tmp'
      - name: Validate enterprise Compose configuration
        shell: bash
        run: |
          cp .env.production.example .env.production
          export FIREBASE_CREDENTIALS_FILE=/tmp/radiotech-ci-credentials.json
          printf '{}' > "$FIREBASE_CREDENTIALS_FILE"
          docker compose -f compose.yaml -f compose.enterprise.yaml config --quiet
