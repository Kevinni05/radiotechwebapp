services:
  - type: web
    name: radiotechwebapp
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health/readiness
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PORT
        value: "10000"
      - key: RADIOTECH_UPSTREAM_URL
        value: https://radiotech-web-1051055442339.europe-west1.run.app
